    --panel2:#e8e0eb;

    --muted2:#79747e;
    --accent:#6750a4;
    --on-accent:#ffffff;
    --accent-container:#eaddff;
    --on-accent-container:#21005d;

  html,body{height:100%; height:100dvh; overflow:hidden}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:15px/1.5 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;

<script type="module">
import { joinRoom, selfId } from 'trystero/torrent'
import { marked } from 'marked'
import DOMPurify from 'dompurify'
import hljs from 'highlight.js'

/* =======================================================================
   White Rabbit — minimal P2P chat (single-file, zero build), a Chitchatter clone
   Features: multi-peer chat, DM, markdown+syntax-highlight, history
   backfill, audio/video, screen sharing, livestream, encrypted file sending,
   public/private rooms, E2E (WebRTC + password), peer verification via
   public-key cryptography, client-side peer mute/block, streamer mode,
   browser notifications + audio chime, mobile-friendly responsive layout,
   no persistence, themes, <chat-room/>.
   ======================================================================= */

const APP_ID = 'white-rabbit-p2p-v1'             // global namespace on the trackers
const enc = new TextEncoder()

/* ---------------- basic helpers ---------------- */
const $ = (sel, root = document) => root.querySelector(sel)
const el = (tag, props = {}, ...kids) => {
  const n = Object.assign(document.createElement(tag), props)
  for (const k of kids) if (k) n.append(k)
  return n
}
const uuid = () => crypto.randomUUID()
const nowTs = () => Date.now()
const fmtTime = t => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
const fmtSize = b => b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(1) + ' KB'
  : b < 1073741824 ? (b / 1048576).toFixed(1) + ' MB' : (b / 1073741824).toFixed(2) + ' GB'
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)))
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0))
const randSecret = () => b64(crypto.getRandomValues(new Uint8Array(24))).replace(/[+/=]/g, m => ({ '+': '-', '/': '_', '=': '' }[m]))
async function sha256hex(buf) {
  const h = await crypto.subtle.digest('SHA-256', buf)
  return [...new Uint8Array(h)].map(x => x.toString(16).padStart(2, '0')).join('')
}

/* ---------------- identity + public-key verification ---------------- */
let identity
async function initIdentity() {
  const kp = await crypto.subtle.generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, true, ['sign', 'verify'])
  const pubJwk = await crypto.subtle.exportKey('jwk', kp.publicKey)
  const raw = await crypto.subtle.exportKey('raw', kp.publicKey)
  const sig = b64(await crypto.subtle.sign({ name: 'ECDSA', hash: 'SHA-256' }, kp.privateKey, enc.encode(selfId)))
  identity = { pubJwk, sig, fingerprint: (await sha256hex(raw)).slice(0, 16) }
}
async function verifyPeer(peerId, pubJwk, sig) {
  try {
    const key = await crypto.subtle.importKey('jwk', pubJwk, { name: 'ECDSA', namedCurve: 'P-256' }, true, ['verify'])
    const ok = await crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, key, unb64(sig), enc.encode(peerId))
    const raw = await crypto.subtle.exportKey('raw', key)
    return { ok, fingerprint: (await sha256hex(raw)).slice(0, 16) }
  } catch { return { ok: false, fingerprint: '????????????????' } }
}

/* ---------------- user settings + client-side moderation ---------------- */
const settings = loadSettings()
function loadSettings() {
  let s = {}
  try { s = JSON.parse(localStorage.getItem('whiterabbit.settings') || '{}') } catch {}
  return {
    name: s.name || 'Anon-' + selfId.slice(0, 4),
    color: s.color || '#' + ((Math.abs([...selfId].reduce((a, c) => a * 33 + c.charCodeAt(0), 7)) % 0xffffff) | 0x404040).toString(16).padStart(6, '0').slice(0, 6),
    theme: s.theme || 'dark',
    anonymize: Boolean(s.anonymize),
    notifications: s.notifications !== undefined ? Boolean(s.notifications) : true,
    sound: s.sound !== undefined ? Boolean(s.sound) : true,
    blocked: Array.isArray(s.blocked) ? s.blocked : [] // list of { id, fingerprint, name }
  }
}
function saveSettings() { localStorage.setItem('whiterabbit.settings', JSON.stringify(settings)) }
function applyTheme() {
  document.documentElement.dataset.theme = settings.theme
  $('#hljs-dark').disabled = settings.theme !== 'dark'
  $('#hljs-light').disabled = settings.theme === 'dark'
}

function isBlocked(peerId, fingerprint = null) {
  return settings.blocked.some(b => b.id === peerId || (fingerprint && b.fingerprint === fingerprint))
}

function blockPeer(peerId, name = '', fingerprint = '') {
  if (!isBlocked(peerId, fingerprint)) {
    settings.blocked.push({ id: peerId, name: name || 'Anon-' + peerId.slice(0, 4), fingerprint: fingerprint || '' })
    saveSettings()
    current?.session?.onBlockChanged()
  }
}

function unblockPeer(target) {
  settings.blocked = settings.blocked.filter(b => b.id !== target && b.fingerprint !== target)
  saveSettings()
  current?.session?.onBlockChanged()
}

/* ---------------- Notifications & Audio chime ---------------- */
let unreadCount = 0

function updateDocumentTitle(roomName = '') {
  const prefix = unreadCount > 0 ? `(${unreadCount}) ` : ''
  const rName = roomName ? (roomName.startsWith('#') ? roomName : '# ' + roomName) : ''
  document.title = `${prefix}${rName ? rName + ' · ' : ''}White Rabbit`
}

window.addEventListener('focus', () => {
  unreadCount = 0
  updateDocumentTitle(current?.session?.displayRoomName?.() || '')
})
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    unreadCount = 0
    updateDocumentTitle(current?.session?.displayRoomName?.() || '')
  }
})

async function requestNotificationPermission() {
  if ('Notification' in window && Notification.permission === 'default') {
    try { await Notification.requestPermission() } catch {}
  }
}

function playNotificationSound() {
  if (!settings.sound) return
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)()
    const osc = ctx.createOscillator()
    const gain = ctx.createGain()
    osc.type = 'sine'
    osc.frequency.setValueAtTime(587.33, ctx.currentTime) // D5
    osc.frequency.setValueAtTime(880, ctx.currentTime + 0.08) // A5
    gain.gain.setValueAtTime(0.08, ctx.currentTime)
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.3)
    osc.connect(gain)
    gain.connect(ctx.destination)
    osc.start()
    osc.stop(ctx.currentTime + 0.3)
  } catch {}
}

function notifyIncomingMessage(title, body, tag = 'msg') {
  if (document.hidden || !document.hasFocus()) {
    unreadCount++
    updateDocumentTitle(current?.session?.displayRoomName?.() || '')
  }
  playNotificationSound()
  if (!settings.notifications || !('Notification' in window)) return
  if (Notification.permission === 'granted' && (document.hidden || !document.hasFocus())) {
    try {
      const notif = new Notification(title, {
        body,
        icon: 'rabbit.webp',
        badge: 'rabbit.webp',
        tag
      })
      notif.onclick = () => {
        window.focus()
        notif.close()
      }
    } catch {}
  }
}

/* ---------------- safe markdown + syntax highlight ---------------- */
function renderMarkdownInto(node, text) {
  node.innerHTML = DOMPurify.sanitize(marked.parse(text, { breaks: true, gfm: true }))
  node.querySelectorAll('pre code').forEach(b => { try { hljs.highlightElement(b) } catch {} })
}

/* =======================================================================
   ChatSession — room controller and UI
   ======================================================================= */
class ChatSession {
  constructor(container, { roomId, secret, isPublic, shareUrl }) {
    this.container = container
    this.roomId = roomId
    this.shareUrl = shareUrl
    this.isPublic = isPublic
    this.peers = new Map()            // peerId -> {name,color,verified,fingerprint}
    this.messages = []                // in-memory only
    this.seen = new Set()             // dedup backfill
    this.localStream = null
    this.screenStream = null
    this.typingTimer = null
    this.typingPeers = new Set()
    this.targetRecipient = 'all'      // 'all' or peerId
    this.buildUI()
    this.connect(secret)
    updateDocumentTitle(this.displayRoomName())
  }

  /* ---------- UI ---------- */
  buildUI() {
    const c = this.container
    c.innerHTML = ''
    c.classList.add('cc')

    const mic = el('button', { className: 'iconbtn', title: 'Microphone', textContent: '🎙' })
    const cam = el('button', { className: 'iconbtn', title: 'Camera', textContent: '📹' })
    const screen = el('button', { className: 'iconbtn', title: 'Share screen', textContent: '🖥' })
    const theme = el('button', { className: 'iconbtn', title: 'Theme', textContent: '◐' })
    const gear = el('button', { className: 'iconbtn', title: 'Settings', textContent: '⚙' })
    const copy = el('button', { className: 'btn secondary', title: 'Copy invite link' }, '🔗 Invite')
    const leave = el('button', { className: 'btn ghost', title: 'Leave room' }, '✕')

    const status = el('span', { className: 'pill', textContent: 'connecting…' })
    this.statusPill = status

    const divider = () => el('span', { className: 'divider' })
    const head = el('div', { className: 'cc-head' },
      el('div', { className: 'title-wrap' },
        el('span', { className: 'title', title: this.displayRoomName(), textContent: (this.isPublic ? '# ' : '') + this.displayRoomName() }),
        status
      ),
      el('div', { className: 'group' }, mic, cam, screen),
      divider(),
      el('div', { className: 'group' }, copy, theme, gear, leave)
    )

    this.peersBar = el('div', { className: 'cc-peers' })
    this.mediaBar = el('div', { className: 'cc-media' })
    this.log = el('div', { className: 'cc-log' })
    this.typingEl = el('div', { className: 'typing' })

    // Compose Area (Mobile Optimized 2-tier layout)
    const dmBadge = el('div', { className: 'dm-badge', title: 'Click to select recipient' },
      el('span', { className: 'dm-lbl', textContent: '💬 Everyone' })
    )
    this.dmBadge = dmBadge

    const composeTop = el('div', { className: 'compose-top' }, dmBadge)

    const ta = el('textarea', { placeholder: 'Message… (Enter to send, Shift+Enter for new line)', rows: 1 })
    this.input = ta

    const fileBtn = el('button', { className: 'compose-btn-file', title: 'Send file', type: 'button' }, '📎')
    const fileIn = el('input', { type: 'file', className: 'hide', multiple: true })
    
    // SVG send arrow
    const sendBtn = el('button', { className: 'compose-btn-send', title: 'Send', type: 'button' })
    sendBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>`

    const composeMain = el('div', { className: 'compose-main' },
      fileBtn,
      fileIn,
      ta,
      sendBtn
    )

    const compose = el('div', { className: 'cc-compose' }, composeTop, composeMain)

    c.append(head, this.peersBar, this.mediaBar, this.log, this.typingEl, compose)

    // Events
    copy.onclick = async () => {
      try { await navigator.clipboard.writeText(this.shareUrl); copy.textContent = 'Copied!'; setTimeout(() => copy.textContent = '🔗 Invite', 1500) }
      catch { prompt('Copy the invite link:', this.shareUrl) }
    }
    leave.onclick = () => { location.hash = '' }
    theme.onclick = () => { settings.theme = settings.theme === 'dark' ? 'light' : 'dark'; saveSettings(); applyTheme() }
    gear.onclick = () => openSettings()
    mic.onclick = () => this.toggleUserMedia('audio', mic)
    cam.onclick = () => this.toggleUserMedia('video', cam)
    screen.onclick = () => this.toggleScreen(screen)
    fileBtn.onclick = () => fileIn.click()
    fileIn.onchange = () => { [...fileIn.files].forEach(f => this.shareFile(f)); fileIn.value = '' }
    sendBtn.onclick = () => this.sendCurrent()
    dmBadge.onclick = () => this.openRecipientPicker()

    ta.addEventListener('input', () => { this.autosize(); this.notifyTyping() })
    ta.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); this.sendCurrent() }
    })

    this.renderPeers()
    this.updateDmBadge()
  }

  displayRoomName() {
    return this.isPublic ? decodeURIComponent(this.roomId) : 'private room'
  }
  autosize() { const t = this.input; t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 120) + 'px' }

  /* ---------- Trystero connection ---------- */
  connect(secret) {
    const room = joinRoom({ appId: APP_ID, password: secret }, this.roomId)
    this.room = room

    const [sendMsg, getMsg] = room.makeAction('msg')
    const [sendMeta, getMeta] = room.makeAction('meta')
    const [sendHist, getHist] = room.makeAction('hist')
    const [sendTyp, getTyp] = room.makeAction('typ')
    const [sendFile, getFile, onFileProgress] = room.makeAction('file')
    this._sendMsg = sendMsg; this._sendMeta = sendMeta; this._sendTyp = sendTyp; this._sendFile = sendFile

    const myMeta = () => ({ name: settings.name, color: settings.color, pubJwk: identity.pubJwk, sig: identity.sig })

    room.onPeerJoin(async peerId => {
      if (!isBlocked(peerId)) this.addSystem(`${this.nameOf(peerId)} joined`)
      sendMeta(myMeta(), peerId)
      if (this.messages.length) setTimeout(() => sendHist(this.messages.slice(-200), peerId), 700)
      this.updateStatus()
      this.renderPeers()
    })

    room.onPeerLeave(peerId => {
      const nm = this.nameOf(peerId)
      const wasBlocked = isBlocked(peerId)
      this.peers.delete(peerId); this.typingPeers.delete(peerId)
      if (!wasBlocked) this.addSystem(`${nm} left`)
      if (this.targetRecipient === peerId) this.setRecipient('all')
      this.renderPeers(); this.renderTyping(); this.updateStatus()
      this.mediaBar.querySelectorAll(`[data-peer="${CSS.escape(peerId)}"]`).forEach(n => n.remove())
    })

    getMeta(async (m, peerId) => {
      const v = await verifyPeer(peerId, m.pubJwk, m.sig)
      this.peers.set(peerId, { name: m.name || 'Anon', color: m.color || '#888', verified: v.ok, fingerprint: v.fingerprint })
      this.renderPeers()
      this.updateDmBadge()
    })

    getMsg((data, peerId) => {
      const peer = this.peers.get(peerId)
      if (isBlocked(peerId, peer?.fingerprint)) return // Drop messages from blocked peers
      this.addMessage({ ...data, authorId: peerId }, false)
    })

    getHist((list, peerId) => {
      for (const m of list) {
        const authId = m.authorId || peerId
        const peer = this.peers.get(authId)
        if (isBlocked(authId, peer?.fingerprint)) continue
        this.addMessage({ ...m, authorId: authId }, false, true)
      }
    })

    getTyp((isTyping, peerId) => {
      const peer = this.peers.get(peerId)
      if (isBlocked(peerId, peer?.fingerprint)) return
      if (isTyping) this.typingPeers.add(peerId); else this.typingPeers.delete(peerId)
      this.renderTyping()
    })

    onFileProgress((pct, peerId, meta) => {
      const peer = this.peers.get(peerId)
      if (isBlocked(peerId, peer?.fingerprint)) return
      this.upsertFileBubble(meta, peerId, false, pct)
    })
    getFile((bytes, peerId, meta) => {
      const peer = this.peers.get(peerId)
      if (isBlocked(peerId, peer?.fingerprint)) return
      const blob = new Blob([bytes], { type: meta.type || 'application/octet-stream' })
      this.completeFileBubble(meta, peerId, URL.createObjectURL(blob))
      const sender = this.nameOf(peerId)
      notifyIncomingMessage(`📎 File from ${sender}`, `${meta.name} (${fmtSize(meta.size)})`, meta.id)
    })

    room.onPeerStream((stream, peerId, meta) => {
      const peer = this.peers.get(peerId)
      if (isBlocked(peerId, peer?.fingerprint)) return
      this.addVideo(peerId, stream, (meta && meta.kind) || 'cam')
    })

    sendMeta(myMeta())
    this.updateStatus()
    setTimeout(() => { if (!this.peers.size) this.statusPill.textContent = 'waiting for peers…' }, 2500)
  }

  updateStatus() {
    const n = this.peers.size
    this.statusPill.textContent = n ? `${n + 1} online` : 'waiting for peers…'
  }

  nameOf(peerId) {
    if (settings.anonymize) {
      return peerId === selfId ? 'You (Anon-' + selfId.slice(0, 4) + ')' : 'Anon-' + peerId.slice(0, 4)
    }
    return peerId === selfId ? settings.name : (this.peers.get(peerId)?.name || 'Anon-' + peerId.slice(0, 4))
  }
  colorOf(peerId) { return peerId === selfId ? settings.color : (this.peers.get(peerId)?.color || '#888') }

  updateIdentity() {
    if (this._sendMeta) this._sendMeta({ name: settings.name, color: settings.color, pubJwk: identity.pubJwk, sig: identity.sig })
    this.renderPeers()
    this.updateDmBadge()
  }

  onBlockChanged() {
    for (const [id, p] of this.peers) {
      if (isBlocked(id, p.fingerprint)) {
        this.mediaBar.querySelectorAll(`[data-peer="${CSS.escape(id)}"]`).forEach(n => n.remove())
        this.typingPeers.delete(id)
      }
    }
    this.renderTyping()
    this.renderPeers()
    this.updateDmBadge()
  }

  /* ---------- messages ---------- */
  sendCurrent() {
    const text = this.input.value.trim()
    if (!text) return
    const target = this.targetRecipient
    const dm = target !== 'all'
    const msg = { id: uuid(), text, ts: nowTs(), dm, authorId: selfId, to: dm ? target : null }
    this.addMessage(msg, true)
    this._sendMsg({ id: msg.id, text, ts: msg.ts, dm, to: msg.to }, dm ? target : null)
    this.input.value = ''; this.autosize(); this.stopTyping()
  }

  addMessage(msg, mine, fromHistory = false) {
    if (this.seen.has(msg.id)) return
    this.seen.add(msg.id)
    this.messages.push(msg)
    this.messages.sort((a, b) => a.ts - b.ts)

    const node = el('div', { className: 'msg' + (mine ? ' me' : '') })
    const meta = el('div', { className: 'meta' })
    
    const nmSpan = el('span', {
      className: 'nm',
      textContent: this.nameOf(msg.authorId),
      style: `color:${this.colorOf(msg.authorId)}`
    })
    if (!mine) nmSpan.onclick = () => openPeerModal(msg.authorId, this.peers.get(msg.authorId))

    meta.append(nmSpan, el('span', { className: 'ts', textContent: fmtTime(msg.ts) }))
    if (msg.dm) meta.append(el('span', { className: 'dm', textContent: mine ? 'DM → ' + this.nameOf(msg.to) : 'DM' }))
    
    const body = el('div', { className: 'body' })
    renderMarkdownInto(body, msg.text)
    node.append(meta, body)
    this.appendOrdered(node, msg.ts, fromHistory)

    if (!mine && !fromHistory) {
      const sender = this.nameOf(msg.authorId)
      const title = msg.dm ? `🔒 DM from ${sender}` : `💬 ${sender} (# ${this.displayRoomName()})`
      notifyIncomingMessage(title, msg.text.slice(0, 120), msg.id)
    }
  }

  appendOrdered(node, ts, fromHistory) {
    node.dataset.ts = ts
    const atBottom = this.log.scrollHeight - this.log.scrollTop - this.log.clientHeight < 60
    let next = null
    for (const child of this.log.children) {
      if (+child.dataset.ts > ts) { next = child; break }
    }
    this.log.insertBefore(node, next)
    if (!fromHistory || atBottom) this.log.scrollTop = this.log.scrollHeight
  }

  addSystem(text) {
    const n = el('div', { className: 'sys', textContent: text })
    n.dataset.ts = nowTs()
    this.log.append(n)
    this.log.scrollTop = this.log.scrollHeight
  }

  /* ---------- typing indicator ---------- */
  notifyTyping() {
    if (!this._sendTyp) return
    if (!this.typingTimer) this._sendTyp(true)
    clearTimeout(this.typingTimer)
    this.typingTimer = setTimeout(() => this.stopTyping(), 2000)
  }
  stopTyping() { if (this.typingTimer) { clearTimeout(this.typingTimer); this.typingTimer = null; this._sendTyp && this._sendTyp(false) } }
  renderTyping() {
    const names = [...this.typingPeers].filter(p => !isBlocked(p, this.peers.get(p)?.fingerprint)).map(p => this.nameOf(p))
    this.typingEl.textContent = names.length === 0 ? ''
      : names.length === 1 ? `${names[0]} is typing…`
      : `${names.slice(0, 2).join(', ')}${names.length > 2 ? ' and others' : ''} are typing…`
  }

  /* ---------- recipient & peers UI ---------- */
  setRecipient(target) {
    this.targetRecipient = target
    this.updateDmBadge()
  }

  updateDmBadge() {
    if (!this.dmBadge) return
    if (this.targetRecipient === 'all') {
      this.dmBadge.className = 'dm-badge'
      this.dmBadge.innerHTML = '<span>💬 Everyone</span> <span style="font-size:11px;color:var(--muted2)">▼</span>'
    } else {
      const p = this.peers.get(this.targetRecipient)
      const name = this.nameOf(this.targetRecipient)
      this.dmBadge.className = 'dm-badge active'
      this.dmBadge.innerHTML = `<span>🔒 DM: ${name}</span> <span class="close-dm" title="Back to everyone">✕</span>`
      $('.close-dm', this.dmBadge)?.addEventListener('click', e => {
        e.stopPropagation()
        this.setRecipient('all')
      })
    }
  }

  openRecipientPicker() {
    let pickerDlg = el('dialog')
    const list = el('div', { className: 'dlg-b', style: 'padding:10px' })
    
    const optAll = el('button', { className: 'btn ghost', style: 'justify-content:flex-start; width:100%', textContent: '💬 Send to Everyone' })
    optAll.onclick = () => { this.setRecipient('all'); pickerDlg.close() }
    list.append(optAll)

    for (const [id, p] of this.peers) {
      if (isBlocked(id, p.fingerprint)) continue
      const opt = el('button', { className: 'btn ghost', style: 'justify-content:flex-start; width:100%; gap:8px' },
        el('span', { className: 'swatch', style: `width:10px;height:10px;border-radius:50%;background:${p.color}` }),
        el('span', { textContent: '🔒 DM: ' + this.nameOf(id) })
      )
      opt.onclick = () => { this.setRecipient(id); pickerDlg.close() }
      list.append(opt)
    }

    const cancel = el('button', { className: 'btn secondary', textContent: 'Cancel' })
    cancel.onclick = () => pickerDlg.close()
    pickerDlg.append(
      el('div', { className: 'dlg-h', textContent: 'Select Recipient' }),
      list,
      el('div', { className: 'dlg-f' }, cancel)
    )
    document.body.append(pickerDlg)
    pickerDlg.showModal()
    pickerDlg.onclose = () => pickerDlg.remove()
  }

  renderPeers() {
    this.peersBar.innerHTML = ''
    const me = el('div', { className: 'peer-chip' },
      el('span', { className: 'swatch', style: `background:${settings.color}` }),
      el('span', { textContent: this.nameOf(selfId) }),
      el('span', { className: 'fp mono', textContent: identity.fingerprint })
    )
    me.onclick = () => openSettings()
    this.peersBar.append(me)

    for (const [id, p] of this.peers) {
      const blocked = isBlocked(id, p.fingerprint)
      const chip = el('div', { className: 'peer-chip' + (blocked ? ' blocked' : '') },
        el('span', { className: 'swatch', style: `background:${p.color}` }),
        el('span', { textContent: (blocked ? '🚫 ' : '') + this.nameOf(id) }),
        el('span', { className: 'vf ' + (p.verified ? 'ok' : 'no'), title: p.verified ? 'Verified identity' : 'Not verified', textContent: p.verified ? '✔' : '⚠' }),
        el('span', { className: 'fp mono', textContent: p.fingerprint })
      )
      chip.onclick = () => openPeerModal(id, p)
      this.peersBar.append(chip)
    }
  }

  /* ---------- files ---------- */
  async shareFile(file) {
    const meta = { id: uuid(), name: file.name, type: file.type, size: file.size }
    this.upsertFileBubble(meta, selfId, true, 0)
    const buf = new Uint8Array(await file.arrayBuffer())
    const target = this.targetRecipient === 'all' ? null : this.targetRecipient
    await this._sendFile(buf, target, meta, pct => this.upsertFileBubble(meta, selfId, true, pct))
    this.completeFileBubble(meta, selfId, URL.createObjectURL(file))
  }
  fileBubbleId(meta, peerId) { return 'f_' + meta.id + '_' + peerId }
  upsertFileBubble(meta, peerId, mine, pct) {
    let node = $('#' + CSS.escape(this.fileBubbleId(meta, peerId)), this.log)
    if (!node) {
      node = el('div', { className: 'msg' + (mine ? ' me' : ''), id: this.fileBubbleId(meta, peerId) })
      const head = el('div', { className: 'meta' },
        el('span', { className: 'nm', textContent: this.nameOf(peerId), style: `color:${this.colorOf(peerId)}` }),
        el('span', { className: 'ts', textContent: fmtTime(nowTs()) }))
      const card = el('div', { className: 'filecard' },
        el('span', { className: 'fi', textContent: 'FILE' }),
        el('div', { className: 'fmeta' },
          el('div', { className: 'fname', textContent: meta.name }),
          el('div', { className: 'fsize', textContent: fmtSize(meta.size) + (mine ? ' · sending…' : ' · receiving…') }),
          el('div', { className: 'bar' }, el('i', {}))))
      node.append(head, card)
      this.appendOrdered(node, nowTs(), false)
    }
    const bar = $('.bar > i', node); if (bar) bar.style.width = Math.round((pct || 0) * 100) + '%'
  }
  completeFileBubble(meta, peerId, url) {
    const node = $('#' + CSS.escape(this.fileBubbleId(meta, peerId)), this.log)
    if (!node) return
    $('.bar', node)?.remove()
    const fsize = $('.fsize', node); if (fsize) fsize.textContent = fmtSize(meta.size)
    const link = el('a', { href: url, download: meta.name, textContent: '⬇ Download', style: 'font-weight:600' })
    $('.fmeta', node).append(link)
  }

  /* ---------- media / calls ---------- */
  async toggleUserMedia(kind, btn) {
    try {
      if (this.localStream && this.localStream.getTracks().some(t => t.kind === kind)) {
        this.localStream.getTracks().filter(t => t.kind === kind).forEach(t => { t.stop(); this.localStream.removeTrack(t) })
        btn.classList.remove('on')
        if (this.localStream.getTracks().length === 0) {
          this.room.removeStream(this.localStream); this.removeVideo(selfId, 'cam'); this.localStream = null
        }
        return
      }
      const fresh = await navigator.mediaDevices.getUserMedia(kind === 'video' ? { video: true } : { audio: true })
      btn.classList.add('on')
      if (!this.localStream) {
        this.localStream = fresh
        this.room.addStream(this.localStream, null, { kind: 'cam' })
        if (kind === 'video') this.addVideo(selfId, this.localStream, 'cam', true)
      } else {
        fresh.getTracks().forEach(t => this.localStream.addTrack(t))
        this.room.addStream(this.localStream, null, { kind: 'cam' })
        if (kind === 'video') this.addVideo(selfId, this.localStream, 'cam', true)
      }
    } catch (e) { this.addSystem('Media denied: ' + e.message) }
  }
  async toggleScreen(btn) {
    try {
      if (this.screenStream) {
        this.screenStream.getTracks().forEach(t => t.stop())
        this.room.removeStream(this.screenStream); this.removeVideo(selfId, 'screen')
        this.screenStream = null; btn.classList.remove('on'); return
      }
      const s = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true })
      this.screenStream = s; btn.classList.add('on')
      this.room.addStream(s, null, { kind: 'screen' })
      this.addVideo(selfId, s, 'screen', true)
      s.getVideoTracks()[0].addEventListener('ended', () => this.toggleScreen(btn))
    } catch (e) { this.addSystem('Screen sharing cancelled') }
  }
  addVideo(peerId, stream, kind, muted = false) {
    this.removeVideo(peerId, kind)
    const v = el('video', { autoplay: true, playsInline: true, muted })
    v.srcObject = stream
    const wrap = el('div', { className: 'vwrap' + (kind === 'screen' ? ' screen' : '') },
      v, el('span', { className: 'lbl', textContent: (kind === 'screen' ? 'Screen · ' : '') + this.nameOf(peerId) + (muted ? ' (you)' : '') }))
    wrap.dataset.peer = peerId; wrap.dataset.kind = kind
    this.mediaBar.append(wrap)
  }
  removeVideo(peerId, kind) {
    this.mediaBar.querySelectorAll(`[data-peer="${CSS.escape(peerId)}"][data-kind="${kind}"]`).forEach(n => n.remove())
  }

  destroy() {
    try { this.localStream?.getTracks().forEach(t => t.stop()) } catch {}
    try { this.screenStream?.getTracks().forEach(t => t.stop()) } catch {}
    try { this.room?.leave() } catch {}
  }
}

/* =======================================================================
   Peer Action Modal (DM, Mute/Block, Info)
   ======================================================================= */
function openPeerModal(peerId, peerData) {
  let pDlg = el('dialog')
  const name = current?.session?.nameOf(peerId) || peerData?.name || peerId.slice(0, 6)
  const fp = peerData?.fingerprint || ''
  const blocked = isBlocked(peerId, fp)

  const dmBtn = el('button', { className: 'btn secondary', style: 'width:100%', textContent: '🔒 Send Direct Message (DM)' })
  dmBtn.onclick = () => {
    current?.session?.setRecipient(peerId)
    pDlg.close()
  }

  const blockBtn = el('button', {
    className: 'btn ' + (blocked ? 'secondary' : 'danger'),
    style: 'width:100%',
    textContent: blocked ? '✓ Unblock this peer' : '🚫 Mute / Block this peer'
  })
  blockBtn.onclick = () => {
    if (blocked) {
      unblockPeer(peerId)
      if (fp) unblockPeer(fp)
    } else {
      blockPeer(peerId, peerData?.name || name, fp)
    }
    pDlg.close()
  }

  const closeBtn = el('button', { className: 'btn ghost', textContent: 'Close' })
  closeBtn.onclick = () => pDlg.close()

  pDlg.append(
    el('div', { className: 'dlg-h', textContent: name }),
    el('div', { className: 'dlg-b' },
      el('div', { style: 'font-size:13px; color:var(--muted)' },
        el('div', {}, 'ID: ', el('span', { className: 'mono' }, peerId)),
        fp ? el('div', { style: 'margin-top:4px' }, 'Fingerprint: ', el('span', { className: 'mono' }, fp)) : null,
        el('div', { style: 'margin-top:4px' }, 'Status: ', el('span', { style: `color:var(${peerData?.verified ? '--ok' : '--warn'})` }, peerData?.verified ? '✔ Verified identity' : '⚠ Unverified'))
      ),
      el('div', { style: 'display:flex; flex-direction:column; gap:8px; margin-top:8px' },
        dmBtn,
        blockBtn
      )
    ),
    el('div', { className: 'dlg-f' }, closeBtn)
  )

  document.body.append(pDlg)
  pDlg.showModal()
  pDlg.onclose = () => pDlg.remove()
}

/* =======================================================================
   Web Component <chat-room room="..." [secret="..."]>
   ======================================================================= */
class ChatRoomElement extends HTMLElement {
  connectedCallback() {
    const roomId = this.getAttribute('room')
    if (!roomId) { this.textContent = 'Missing "room" attribute'; return }
    const secret = this.getAttribute('secret') || roomId
    const isPublic = !this.hasAttribute('secret')
    this.session = new ChatSession(this, { roomId, secret, isPublic, shareUrl: location.href })
  }
  disconnectedCallback() { this.session?.destroy(); this.session = null }
}
customElements.define('chat-room', ChatRoomElement)

/* =======================================================================
   Router + Home screen
   ======================================================================= */
const app = $('#app')
let current = null

function parseHash() {
  const h = location.hash.replace(/^#/, '')
  const parts = h.split('/').filter(Boolean)
  if (parts[0] === 'r' && parts[1]) return { isPublic: true, roomId: parts[1], secret: parts[1] }
  if (parts[0] === 'p' && parts[1] && parts[2]) return { isPublic: false, roomId: parts[1], secret: parts[2] }
  return null
}

function route() {
  if (current) { current.session?.destroy?.(); current.remove?.(); current = null }
  app.innerHTML = ''
  const r = parseHash()
  if (!r) { renderHome(); return }
  const node = document.createElement('chat-room')
  node.setAttribute('room', r.roomId)
  if (!r.isPublic) node.setAttribute('secret', r.secret)
  app.append(node)
  current = node
}

function renderHome() {
  const home = el('div', { className: 'home' })
  home.append(
    el('div', { className: 'brand' }, el('span', { className: 'dot' }), el('h1', { textContent: 'White Rabbit' })),
    el('div', { className: 'sub', textContent: 'End-to-end P2P chat, no server, no account. Follow the white rabbit.' }))

  // private room
  const priv = el('div', { className: 'card' })
  priv.append(el('h3', { textContent: 'Private room' }),
    el('div', { className: 'sub', textContent: 'Random id and key in the link. Share it only with whom you want.' }))
  const privBtn = el('button', { className: 'btn', textContent: 'Create and join' })
  privBtn.onclick = () => { location.hash = `#/p/${uuid()}/${randSecret()}` }
  priv.append(el('div', { className: 'row' }, privBtn))

  // public room
  const pub = el('div', { className: 'card' })
  pub.append(el('h3', { textContent: 'Public room' }),
    el('div', { className: 'sub', textContent: 'Anyone who types the same name joins (the key is the name).' }))
  const nameIn = el('input', { type: 'text', placeholder: 'e.g. kitchen, project-x…' })
  const pubBtn = el('button', { className: 'btn secondary', textContent: 'Join' })
  const go = () => { const n = nameIn.value.trim(); if (n) location.hash = `#/r/${encodeURIComponent(n)}` }
  pubBtn.onclick = go
  nameIn.addEventListener('keydown', e => { if (e.key === 'Enter') go() })
  pub.append(el('div', { className: 'row' }, el('div', { className: 'grow' }, nameIn), pubBtn))

  // identity
  const idc = el('div', { className: 'card' })
  idc.append(el('h3', { textContent: 'You' }))
  const nm = el('input', { type: 'text', value: settings.name })
  const col = el('input', { type: 'color', value: settings.color })
  nm.oninput = () => { settings.name = nm.value.trim() || settings.name; saveSettings() }
  col.oninput = () => { settings.color = col.value; saveSettings() }
  const themeBtn = el('button', { className: 'btn ghost', textContent: 'Theme' })
  themeBtn.onclick = () => { settings.theme = settings.theme === 'dark' ? 'light' : 'dark'; saveSettings(); applyTheme() }
  idc.append(el('div', { className: 'row' }, el('div', { className: 'grow' }, nm), col, themeBtn),
    el('div', { className: 'sub mono', style: 'margin-top:8px', textContent: 'fingerprint: ' + identity.fingerprint }))

  const feats = el('ul', { className: 'features' })
  ;['Multi-peer + DM', 'Client-side Mute/Block', 'Streamer Mode (Anon)', 'Browser notifications', 'Markdown + highlight',
    'Audio / video / screen', 'Encrypted files', 'History backfill', 'Peer verification', 'E2E (WebRTC + password)', 'Light/dark themes', 'Mobile responsive'
  ].forEach(f => feats.append(el('li', { textContent: '✓ ' + f })))

  const foot = el('div', { className: 'foot' },
    el('a', { href: 'https://github.com/scobru/whiterabbit', target: '_blank', rel: 'noopener', textContent: '★ scobru/whiterabbit on GitHub' }))

  home.append(priv, pub, idc, el('div', { className: 'card' }, el('h3', { textContent: 'Features' }), feats), foot)
  app.append(home)
}

/* ---------------- Settings & Moderation Dialog ---------------- */
let dlg
function openSettings() {
  if (dlg) dlg.remove()
  dlg = el('dialog')
  
  const nm = el('input', { type: 'text', value: settings.name })
  const col = el('input', { type: 'color', value: settings.color })
  const notifCheck = el('input', { type: 'checkbox', checked: settings.notifications })
  const notifLabel = el('label', { className: 'checkbox-row' }, notifCheck, el('span', {}, '🔔 Browser Notifications'))
  const soundCheck = el('input', { type: 'checkbox', checked: settings.sound })
  const soundLabel = el('label', { className: 'checkbox-row' }, soundCheck, el('span', {}, '🔊 Notification Sound'))

  const anonCheck = el('input', { type: 'checkbox', checked: settings.anonymize })
  const anonLabel = el('label', { className: 'checkbox-row' }, anonCheck, el('span', {}, '🕶 Anonymize all nicknames (Streamer Mode)'))

  notifCheck.onchange = async () => {
    if (notifCheck.checked) {
      await requestNotificationPermission()
    }
  }

  const blockedContainer = el('div', { className: 'blocked-list' })
  function renderBlocked() {
    blockedContainer.innerHTML = ''
    if (settings.blocked.length === 0) {
      blockedContainer.append(el('div', { style: 'font-size:12px; color:var(--muted2); font-style:italic' }, 'No blocked users'))
      return
    }
    settings.blocked.forEach(b => {
      const item = el('div', { className: 'blocked-item' },
        el('span', { textContent: b.name + (b.fingerprint ? ` (${b.fingerprint.slice(0, 8)}…)` : '') }),
        el('button', { className: 'btn ghost', style: 'padding:2px 8px; font-size:11px; min-height:auto', textContent: 'Unblock' })
      )
      $('button', item).onclick = () => {
        unblockPeer(b.id)
        if (b.fingerprint) unblockPeer(b.fingerprint)
        renderBlocked()
      }
      blockedContainer.append(item)
    })
  }
  renderBlocked()

  const close = el('button', { className: 'btn secondary', textContent: 'Close' })
  const save = el('button', { className: 'btn', textContent: 'Save' })
  
  dlg.append(
    el('div', { className: 'dlg-h', textContent: 'Settings & Privacy' }),
    el('div', { className: 'dlg-b' },
      el('label', { className: 'fld' }, 'Your Name', nm),
      el('label', { className: 'fld' }, 'Your Color', col),
      notifLabel,
      soundLabel,
      anonLabel,
      el('div', { style: 'border-top:1px solid var(--border); padding-top:10px; margin-top:4px' },
        el('div', { style: 'font-size:13px; font-weight:500; margin-bottom:6px' }, '🚫 Blocked / Muted Peers:'),
        blockedContainer
      ),
      el('div', { className: 'sub mono', style: 'font-size:11px; margin-top:6px' }, 'Your fingerprint: ' + identity.fingerprint)
    ),
    el('div', { className: 'dlg-f' }, close, save)
  )

  close.onclick = () => dlg.close()
  save.onclick = () => {
    settings.name = nm.value.trim() || settings.name
    settings.color = col.value
    settings.anonymize = anonCheck.checked
    settings.notifications = notifCheck.checked
    settings.sound = soundCheck.checked
    saveSettings()
    current?.session?.updateIdentity?.()
    current?.session?.renderPeers?.()
    dlg.close()
  }

  document.body.append(dlg)
  dlg.showModal()
  dlg.onclose = () => dlg.remove()
}

/* ---------------- startup ---------------- */
try {
  applyTheme()
  await initIdentity()
  window.addEventListener('hashchange', route)
  route()
} catch (e) {
  app.innerHTML = '<pre style="padding:20px;color:#f88;white-space:pre-wrap">' + (e.stack || e.message) + '</pre>'
}
</script>
